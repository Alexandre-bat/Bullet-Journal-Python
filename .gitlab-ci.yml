image: python:3.12-slim

stages: [quality, test]

before_script:
  - pip install --quiet -r requirements.txt

pep8:
  stage: quality
  script:
    - flake8 bujo tests

docstrings:
  stage: quality
  script:
    - pydocstyle bujo tests

tests:
  stage: test
  script:
    - python -m coverage run -m pytest -v
    - python -m coverage report --show-missing --fail-under=90
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?)%/'
