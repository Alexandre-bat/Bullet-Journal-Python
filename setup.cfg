# Configuration des outils pour la CI et les développeurs.

[pydocstyle]
convention = pep257
# D401 : « impératif » n'a pas de sens pour des docstrings en français.
add-ignore = D401

[flake8]
max-line-length = 79
exclude = .git,__pycache__,.pytest_cache

[tool:pytest]
# Rend le paquet bujo/ importable par les tests sans installation.
pythonpath = .
